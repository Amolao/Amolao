<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Student Unity Developer</title>
  <desc id="desc">An adaptive liquid-glass profile card showing availability for opportunities.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop class="canvas-a" offset="0"/>
      <stop class="canvas-b" offset=".56"/>
      <stop class="canvas-c" offset="1"/>
    </linearGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0a84ff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#5ac8fa" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5ac8fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bf5af2" stop-opacity=".9"/>
      <stop offset=".52" stop-color="#af52de" stop-opacity=".38"/>
      <stop offset="1" stop-color="#af52de" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aqua" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#64d2ff" stop-opacity=".8"/>
      <stop offset="1" stop-color="#64d2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop class="glass-a" offset="0"/>
      <stop class="glass-b" offset=".42"/>
      <stop class="glass-c" offset="1"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".2" stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".54" stop-color="#82d7ff" stop-opacity=".18"/>
      <stop offset=".78" stop-color="#d89cff" stop-opacity=".46"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="spectral" x1="0" y1=".2" x2="1" y2=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".25" stop-color="#64d2ff" stop-opacity=".65"/>
      <stop offset=".7" stop-color="#bf5af2" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".72"/>
      <stop offset=".22" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".62" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#9bdcff" stop-opacity=".16"/>
    </linearGradient>
    <radialGradient id="orbGlass" cx="30%" cy="22%" r="88%">
      <stop offset="0" stop-color="#fff" stop-opacity=".8"/>
      <stop offset=".28" stop-color="#e6f7ff" stop-opacity=".26"/>
      <stop offset=".66" stop-color="#7dd3fc" stop-opacity=".14"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity=".22"/>
    </radialGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="panelShadow" x="-20%" y="-25%" width="140%" height="165%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#07111f" flood-opacity=".18"/>
    </filter>
    <filter id="pillShadow" x="-25%" y="-60%" width="150%" height="220%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#13233a" flood-opacity=".14"/>
    </filter>
    <filter id="refract" x="-10%" y="-15%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".007 .016" numOctaves="2" seed="18" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="34" xChannelSelector="R" yChannelSelector="B" result="shifted"/>
      <feGaussianBlur in="shifted" stdDeviation="1.8" result="softened"/>
      <feColorMatrix in="softened" type="saturate" values="1.22"/>
    </filter>
    <filter id="orbRefract" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .02" numOctaves="2" seed="8" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="52" xChannelSelector="R" yChannelSelector="G" result="shifted"/>
      <feGaussianBlur in="shifted" stdDeviation="2.4"/>
    </filter>
    <filter id="orbShadow" x="-55%" y="-55%" width="210%" height="230%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#08101e" flood-opacity=".3"/>
    </filter>
    <filter id="rimBlur" x="-15%" y="-20%" width="130%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <path id="panel" d="M90 52H1190C1208 52 1222 66 1222 84V436C1222 454 1208 468 1190 468H90C72 468 58 454 58 436V84C58 66 72 52 90 52Z"/>
    <clipPath id="frame"><rect width="1280" height="520" rx="32"/></clipPath>
    <clipPath id="panelClip"><use href="#panel"/></clipPath>
    <clipPath id="orbClip"><circle cx="0" cy="0" r="132"/></clipPath>
    <g id="ambientArt">
      <ellipse cx="1092" cy="78" rx="335" ry="290" fill="url(#blue)" filter="url(#soft)"/>
      <ellipse cx="858" cy="488" rx="360" ry="250" fill="url(#violet)" filter="url(#soft)"/>
      <ellipse cx="186" cy="112" rx="255" ry="185" fill="url(#aqua)" opacity=".34" filter="url(#soft)"/>
      <path d="M-100 424C132 286 313 512 547 340S906 79 1392 196" fill="none" stroke="#69bfff" stroke-opacity=".22" stroke-width="78" filter="url(#soft)"/>
      <path d="M-64 464C170 331 327 520 570 360S940 121 1352 228" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="13"/>
      <circle cx="715" cy="111" r="16" fill="#fff" fill-opacity=".5"/>
      <circle cx="745" cy="94" r="6" fill="#fff" fill-opacity=".7"/>
    </g>
    <style>
      .canvas-a{stop-color:#f8fbff}.canvas-b{stop-color:#eaf1f9}.canvas-c{stop-color:#dfe9f5}
      .glass-a{stop-color:#fff;stop-opacity:.38}.glass-b{stop-color:#fff;stop-opacity:.14}.glass-c{stop-color:#d8ecff;stop-opacity:.22}
      .primary{fill:#101828}.secondary{fill:#526070}.status-bg{fill:#fff;fill-opacity:.34}.status-text{fill:#526070}.status-edge{stroke:#fff;stroke-opacity:.78}
      .inner-shade{fill:#edf6ff;fill-opacity:.12}.rim-light{stroke:#fff;stroke-opacity:.74}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif}
      @media (prefers-color-scheme:dark){
        .canvas-a{stop-color:#080c14}.canvas-b{stop-color:#0c1422}.canvas-c{stop-color:#111b2c}
        .glass-a{stop-color:#fff;stop-opacity:.2}.glass-b{stop-color:#bfe3ff;stop-opacity:.07}.glass-c{stop-color:#7aaeff;stop-opacity:.11}
        .primary{fill:#f6f8fb}.secondary{fill:#a9b5c5}.status-bg{fill:#fff;fill-opacity:.09}.status-text{fill:#f6f8fb}.status-edge{stroke:#fff;stroke-opacity:.22}
        .inner-shade{fill:#06101d;fill-opacity:.18}.rim-light{stroke:#fff;stroke-opacity:.42}
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="520" fill="url(#canvas)"/>
    <use href="#ambientArt"/>

    <use href="#panel" fill="url(#glass)" filter="url(#panelShadow)"/>
    <g clip-path="url(#panelClip)">
      <use href="#ambientArt" transform="translate(-12 7) scale(1.022)" filter="url(#refract)" opacity=".92"/>
      <use href="#panel" fill="url(#glass)"/>
      <path d="M58 52H1222V219C1016 180 829 211 659 258C439 319 250 246 58 145Z" fill="url(#sheen)" opacity=".72"/>
      <path class="inner-shade" d="M58 374C284 321 449 452 658 407C885 358 1045 258 1222 304V468H58Z"/>
      <path d="M80 63C258 43 437 64 601 84" fill="none" stroke="#fff" stroke-opacity=".58" stroke-width="3" stroke-linecap="round" filter="url(#rimBlur)"/>
    </g>
    <use href="#panel" fill="none" stroke="url(#spectral)" stroke-width="7" opacity=".3" filter="url(#rimBlur)"/>
    <use href="#panel" fill="none" stroke="url(#edge)" stroke-width="2"/>
    <path d="M93 60H406" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M1208 307V423C1208 440 1197 452 1180 454" fill="none" stroke="#c994ff" stroke-opacity=".46" stroke-width="2.4" stroke-linecap="round"/>

    <g transform="translate(112 104)">
      <g filter="url(#pillShadow)">
        <rect class="status-bg" width="210" height="38" rx="19"/>
        <rect class="status-edge" x=".75" y=".75" width="208.5" height="36.5" rx="18.25" fill="none" stroke-width="1.5"/>
        <path d="M18 5H132" stroke="#fff" stroke-opacity=".62" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <circle cx="21" cy="19" r="5" fill="#34c759"/>
      <circle cx="19.5" cy="17.5" r="1.7" fill="#fff" fill-opacity=".82"/>
      <text class="status-text" x="36" y="24" font-size="12.5" font-weight="600" letter-spacing="1.15">OPEN TO OPPORTUNITIES</text>
      <text class="primary" x="0" y="131" font-size="69" font-weight="650" letter-spacing="-2.1">Unity Developer</text>
      <text class="secondary" x="2" y="181" font-size="25" font-weight="450" letter-spacing=".4">Student · Unity Developer</text>
    </g>

    <g transform="translate(986 260)" filter="url(#orbShadow)">
      <circle r="132" fill="url(#orbGlass)"/>
      <g clip-path="url(#orbClip)" opacity=".88">
        <use href="#ambientArt" transform="translate(-982 -260) scale(1.015)" filter="url(#orbRefract)"/>
        <circle r="132" fill="url(#orbGlass)"/>
        <ellipse cx="-40" cy="-74" rx="96" ry="47" fill="#fff" fill-opacity=".25" transform="rotate(-18)"/>
        <path d="M-132 86C-43 35 24 109 132 52V132H-132Z" fill="#a86af4" fill-opacity=".12"/>
      </g>
      <circle r="128" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1"/>
      <circle r="132" fill="none" stroke="url(#edge)" stroke-width="3"/>
      <path d="M-106-70C-66-129 19-145 78-111" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="4" stroke-linecap="round"/>
      <path d="M72 109C105 87 126 50 131 12" fill="none" stroke="#d29bff" stroke-opacity=".62" stroke-width="4" stroke-linecap="round"/>
      <path d="M-57-48 0-82 57-48 0-14Z" fill="#fff" fill-opacity=".28" stroke="#fff" stroke-opacity=".58"/>
      <path d="M-57-48 0-14V55L-57 21Z" fill="#36bfff" fill-opacity=".22" stroke="#dff7ff" stroke-opacity=".42"/>
      <path d="M57-48 0-14V55L57 21Z" fill="#bf5af2" fill-opacity=".2" stroke="#fff" stroke-opacity=".38"/>
      <path d="M0-14V55" stroke="#fff" stroke-opacity=".5"/>
      <circle cx="73" cy="77" r="9" fill="#fff" fill-opacity=".72"/>
      <circle cx="70" cy="74" r="3" fill="#fff"/>
    </g>
  </g>
</svg>
